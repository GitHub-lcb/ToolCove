[package]
name = "toolcove"
version = "0.1.0"
description = "ToolCove —— 开发者的工具港湾（本地优先的桌面效率工作台）"
authors = ["GitHub-lcb"]
edition = "2021"

[lib]
name = "toolcove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# TSPL 排版引擎：纯计算、无平台依赖，桌面端与手机端（编译成 WASM）共用同一份实现。
# 见 crates/label-core 与 docs/mobile-app-plan.md §6。
label-core = { path = "../crates/label-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
md-5 = "0.11"
getrandom = "0.4"
same-file = "1"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["time", "macros"] }
futures-util = "0.3"
mysql = "28.0.0"
postgres = "0.19.14"
rusqlite = { version = "0.40.1", features = ["bundled"] }
odbc-api = "29.0.0"
local-ip-address = "0.6"
encoding_rs = "0.8"
# 标签打印（TSPL）：中文 GB18030 走 encoding_rs，条码/二维码模块序列用于预览，
# 字符宽度决定换行与居中（打印机是定宽点阵字体）
unicode-width = "0.2"
qrcode = { version = "0.14", default-features = false }
barcoders = "2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory"] }
# 自动签到读 Qoder 本地登录态：Chromium OSCrypt v10 是 AES-256-GCM，外面那层密钥才是 DPAPI
aes-gcm = "0.10"
# TRAE Work CN 的本地凭据信封是 AES-128-CBC（aes 原本只由 aes-gcm 间接引入，这里要显式依赖）
aes = "0.8"
# 截图工具的 PNG 编解码（纯 Rust，三端可编译；捕获/剪贴板依赖见下方 windows 段）
image = { version = "0.25", default-features = false, features = ["png"] }

# 截图工具的原生部分只做 Windows：xcap（Windows Graphics Capture）与 arboard（剪贴板图片）
# 都按目标平台条件依赖，避免 Linux CI / 安卓构建被系统库拖挂（截图本来就是桌面独占能力）
[target.'cfg(target_os = "windows")'.dependencies]
xcap = "0.9"
arboard = "3"

# 截图的「抓帧 → PNG 编码 → IPC 回传」在 F1 关键路径上：编完页面才能拿到帧、遮罩才能显出来。
# dev（tauri dev）默认 opt-level=0，实测 1920x1200@1.5 一块屏编码要 1.5s（release 差一个数量级），
# 于是只给这几个热路径依赖单独开优化——拿回 dev 手感，又不必把整棵依赖树重编一遍。
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.xcap]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3
