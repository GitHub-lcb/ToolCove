<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // 首帧主题：必须在样式表与 JS 之前跑，否则手动选深色的用户会先看到一帧浅色。
      // 与 src/theme.js 的 applyThemeAttribute 是同一套规则，两道保险：
      //   themeMode = system → 不加 data-theme，交给 CSS 媒体查询
      //   themeMode = light/dark → 显式写 data-theme
      // 密度同理挂到 <html>（旧实现绑在 .shell 上，独立工具窗口拿不到）。
      (() => {
        try {
          const root = document.documentElement;
          const mode = localStorage.getItem("themeMode");
          if (mode === "dark" || mode === "light") root.setAttribute("data-theme", mode);
          root.style.colorScheme = mode === "dark" || mode === "light" ? mode : "light dark";
          if (localStorage.getItem("density") === "comfort") root.setAttribute("data-density", "comfort");
        } catch {
          /* localStorage 不可用（隐私模式）：跟随系统即可 */
        }
      })();
    </script>
    <style>
      /* 样式表加载前的兜底背景，避免白闪。值必须与 tokens.css 的 --bg 一致。 */
      html, body, #app { min-height: 100%; margin: 0; background: #f1f2ed; }
      html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #app { background: #101214; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]), html:not([data-theme="light"]) body, html:not([data-theme="light"]) #app { background: #101214; }
      }
    </style>
    <title>ToolCove</title>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
