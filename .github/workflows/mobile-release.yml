# 手机端（安卓 App）发版：推 apk-v* 标签（或在 Actions 手动触发）时构建 APK 并创建 GitHub Release。
#
# 与桌面端发版的关系：
#   · 两条独立的发版线：`v*` 触发桌面端（release.yml），`apk-v*` 触发手机端（本文件）。
#     标签前缀必须区分——上一代手机端就踩过「前缀写错、APK 顶掉桌面版 Release」的事故。
#   · 但**前缀不同并不足够**：GitHub 的 `releases/latest` 是一个可被抢走的标记，
#     而桌面端的更新端点正是 `releases/latest/download/latest.json`。所以本文件的
#     `gh release create` 必须带 `--latest=false`，末尾还有一步显式验指针。改这两处中的
#     任何一处，后果都是"所有 Windows 用户静默收不到更新"，且手机端一切正常、CI 全绿。
#   · 版本号也独立：手机端用 package.json 的 mobileVersion，与桌面 version 各走各的。
#
# 一次性前置配置：
#   若要**正式签名**（上架或长期分发），配以下 Secrets；不配则用 debug 签名（仅供侧载自用）：
#     ANDROID_KEYSTORE_BASE64  keystore 文件的 base64（单行）
#     ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#   未配置时本工作流**照常出包**，只是在 Release 说明里标注「debug 签名，仅供侧载」。
#
# 供应链加固：所有第三方 Action 都 pin 到完整 commit SHA（浮动 tag 可被上游重新指向）。
# 升级方式：查 `GET /repos/<owner>/<repo>/commits/<tag>` 拿新 SHA，替换并把注释里的版本号一起改。
name: Mobile Release

on:
  push:
    tags: ["apk-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: 构建 APK 并发布
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 版本号一致性：标签 ↔ package.json 的 mobileVersion。
      # 注意**不校验 app/build.gradle**：那里的 versionName/versionCode 是从 package.json
      # 派生出来的（单一真相源），拿正则去读它只会读到变量名而不是值——实测踩过这个坑。
      # 真正该验的是**产物里的版本**，所以下面构建完会用 aapt2 dump 出来再比一次。
      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#apk-v}"
          pkg=$(node -p "require('./package.json').mobileVersion")
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then echo "::error::标签 apk-v$tag 与 package.json 的 mobileVersion $pkg 不一致，请先改版本号再打标签"; exit 1; fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "21"

      # 标签排版引擎的 wasm：手机端与桌面端共用同一份 Rust 实现，产物不入库（编译结果），
      # 所以发版时必须在这里构建。build-apk.mjs 也会自己跑一遍（幂等），这里先跑是为了
      # 让下面那一步"引擎自检"能单独失败、错误更清楚。
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/label-core
      - name: 构建并自检排版引擎（wasm）
        run: npm run build:label-wasm

      # Gradle 用 runner 自带的（ubuntu-latest 预装）；不下载项目自带的 .toolchain（1.5GB，
      # 而且 setup-toolchain.mjs 是给 Windows 写的：sdkmanager.bat / commandlinetools-win）。
      - name: 确认 Android SDK 可用
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" || true

      - run: npm ci

      # 发布前必须全绿：标签指向的提交要是坏的，用户装到手机上就是坏版本
      - name: 发布前单测（前端）
        run: npm test

      # 桥的核心逻辑有 JVM 单测（编解码、命令分发、选择器时序），发版前同样要过
      - name: 发布前单测（安卓桥）
        run: |
          cd mobile/android
          gradle :app:testDebugUnitTest --no-daemon --console=plain

      - name: 配置正式签名（有 Secrets 时）
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "TC_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "TC_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "TC_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "TC_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 ANDROID_KEYSTORE_BASE64，将使用 debug 签名（仅供侧载自用）"
          fi

      - name: 构建 APK
        env:
          TC_SYSTEM_TOOLCHAIN: "1"
        run: node mobile/android/build-apk.mjs --system-toolchain

      - name: 收集产物信息
        id: artifact
        run: |
          apk=mobile/android/out/toolcove-release.apk
          ls -la "$apk"
          size=$(du -k "$apk" | cut -f1)
          echo "size_kb=$size" >> "$GITHUB_OUTPUT"
          # 校验产物确实包含前端资源：空壳包能装上、但打开是白屏（最难排查的失败形态）
          unzip -l "$apk" | grep -q "assets/index.html" || { echo "::error::APK 里没有 assets/index.html，是个空壳包"; exit 1; }
          echo "包含前端产物 ✓"
          # 校验产物里的版本号与 package.json 一致：这才是用户装到手机上会看到的那个数字。
          # 拿 aapt2 读产物本身（而不是读 build.gradle 源码——那里是变量引用）。
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          actual=$("$aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          expected=$(node -p "require('./package.json').mobileVersion")
          echo "产物 versionName=$actual 期望=$expected"
          if [ "$actual" != "$expected" ]; then echo "::error::APK 里的版本号 $actual 与 package.json 的 $expected 不一致"; exit 1; fi

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ -z "$tag" ] || [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            tag="apk-v$(node -p "require('./package.json').mobileVersion")"
          fi
          signed="${{ steps.signing.outputs.signed }}"
          if [ "$signed" = "true" ]; then
            note="正式签名构建。"
          else
            note="**debug 签名，仅供侧载自用**（未配置签名 Secrets）。上架或长期分发请配置 ANDROID_KEYSTORE_BASE64 等 Secrets 后重跑。"
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ToolCove 安卓版 $tag（${{ steps.artifact.outputs.size_kb }} KB）

          $note

          安装：下载下方 APK 传到手机点开安装（需允许「安装未知来源应用」）。

          **首次使用建议先到「设置 → AI 模型」配好接口**，否则 Agent 无法运行；
          配置后记录、工作台、工具箱与 Agent 都可离线使用（数据只存本机）。
          EOF
          gh release create "$tag" \
            mobile/android/out/toolcove-release.apk \
            --title "ToolCove Android $tag" \
            --latest=false \
            --notes-file "$RUNNER_TEMP/notes.md" \
            || gh release upload "$tag" mobile/android/out/toolcove-release.apk --clobber

      # ⚠️ 这一步是**线上更新链路的护栏**，删掉它会让所有 Windows 用户静默收不到更新。
      #
      # 桌面端 updater 读的端点是 `releases/latest/download/latest.json`（见 tauri.conf.json），
      # 而 `releases/latest` 是仓库上的一个**显式标记**：`gh release create` 对非 draft、
      # 非 prerelease 的 Release 默认就把这个标记抢过去（--latest 默认 true）。
      # 一旦 APK 的 Release 成为 latest，那条 URL 就 404 —— 而且上面那句 `--latest=false`
      # 一旦被谁改掉，故障是**静默**的：CI 全绿、手机端正常、只有桌面用户装不上新版本。
      # 所以这里不只设 flag，还要在发完之后**验一次指针还在桌面 Release 上**。
      - name: 确认没有抢走桌面端的更新源
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          echo "releases/latest = $latest"
          case "$latest" in
            v[0-9]*) echo "✓ 仍指向桌面版 $latest" ;;
            *) echo "::error::releases/latest 被手机端 Release（$latest）抢走了，桌面端更新源会 404"; exit 1 ;;
          esac
          code=$(curl -s -o /dev/null -w "%{http_code}" -L \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json")
          echo "latest.json HTTP $code"
          [ "$code" = "200" ] || { echo "::error::桌面更新端点取不到（HTTP $code）"; exit 1; }

      # 安卓自动更新的通道：App 只读一个**固定 URL** 的小清单，不查 releases 列表。
      # 为什么这样设计：
      #  - 不占 `releases/latest`（那是桌面的），安卓有自己的 `apk-latest` 通道
      #  - 不用 GitHub REST 列 Release：未认证是 60 次/小时/IP，用户一多就限流；
      #    而 Release 资产是 CDN 静态文件，没有这个问题
      #  - 带 sha256：App 端下载完必须校验再装，否则"资产被替换/中间人"等于任意代码执行
      - name: 发布安卓更新清单（apk-latest 通道）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ -z "$tag" ] || [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            tag="apk-v$(node -p "require('./package.json').mobileVersion")"
          fi
          apk=mobile/android/out/toolcove-release.apk
          version=$(node -p "require('./package.json').mobileVersion")
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          size=$(stat -c%s "$apk")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/toolcove-release.apk"
          node -e '
            const [version, url, sha256, size, out] = process.argv.slice(1);
            const parts = version.split(".").map((n) => parseInt(n, 10) || 0);
            while (parts.length < 3) parts.push(0);
            // versionCode 的编码规则必须与 app/build.gradle 一致：安卓靠它拒绝"装更旧的包"
            require("node:fs").writeFileSync(out, JSON.stringify({
              version, versionCode: parts[0] * 10000 + parts[1] * 100 + parts[2],
              url, sha256, size: Number(size), channel: "apk-latest",
            }, null, 2) + "\n");
          ' "$version" "$url" "$sha" "$size" "$RUNNER_TEMP/apk.json"
          cat "$RUNNER_TEMP/apk.json"
          gh release create apk-latest --title "ToolCove Android update channel" \
            --prerelease --latest=false --notes "自动更新通道指针，不是发版记录。装 APK 请到 apk-v* 的 Release。" || true
          gh release upload apk-latest "$RUNNER_TEMP/apk.json" --clobber
