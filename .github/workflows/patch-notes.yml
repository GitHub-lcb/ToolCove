# 临时流程（用后即删）：给已发布的 v0.4.0 说明顶部补密钥轮换提醒。
# 为什么需要：release.yml 改为自动公开后由 tauri-action 直接创建 Release，说明只有自动生成的
# Full Changelog；而 v0.3.0 从未发布、老用户停在 v0.2.1 或更早，签名密钥已轮换，
# 他们无法通过应用内更新升级，必须在说明里讲清楚。
# 幂等：说明里已有该提醒则直接跳过。
name: Patch Release Notes (temp)

on:
  push:
    branches: [main]
    paths: [".github/workflows/patch-notes.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v0.4.0
    steps:
      - name: 在说明顶部插入提醒（幂等）
        run: |
          body=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body)
          if printf '%s' "$body" | grep -q "轮换更新签名密钥"; then
            echo "说明里已有该提醒，跳过"
            exit 0
          fi
          warning='> ⚠️ **本版已轮换更新签名密钥**：已安装 v0.2.1 及更早版本的用户**无法通过应用内更新升级**，请手动下载本页安装包覆盖安装一次即可，从本版起自动更新恢复正常。'
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes "${warning}

          ${body}"
          echo "--- 更新后的说明开头 ---"
          gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body | head -4
