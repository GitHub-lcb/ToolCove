# 临时诊断 workflow（定位 v0.3.0 发版单测在 Windows runner 上的失败原因，用完即删）。
# 目的：GitHub 的 job 日志需要鉴权才能下载，而「注解」可以匿名读取 —— 所以把失败摘要转成 ::error:: 注解。
# 同时跑 windows-latest 与 ubuntu-latest 做对照（同一提交在 ubuntu 上是绿的）。
name: Diag Tests

on:
  push:
    branches: [main]
    paths: [".github/workflows/diag-tests.yml"]
  workflow_dispatch:

jobs:
  diag:
    name: 单测诊断
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 环境信息
        shell: bash
        run: |
          echo "::notice title=${{ matrix.os }} 环境::node=$(node -v) npm=$(npm -v) tz=$TZ lang=$LANG ci=$CI"
          node -e "console.log('navigator.language =', typeof navigator !== 'undefined' ? navigator.language : '(无 navigator)')"
          node -e "console.log('Intl 默认 locale =', Intl.DateTimeFormat().resolvedOptions().locale, '| 时区 =', Intl.DateTimeFormat().resolvedOptions().timeZone)"

      - name: 运行单测并把失败摘要转成注解
        shell: bash
        run: |
          set +e
          npm test > diag-output.txt 2>&1
          status=$?
          echo "::notice title=${{ matrix.os }} 退出码::$status"
          if [ "$status" -ne 0 ]; then
            # 只挑信息量最大的行：失败文件、失败用例、断言差异、汇总
            grep -aE 'FAIL|×|→|AssertionError|Error:|expected|Tests +[0-9]|Test Files|Snapshots' diag-output.txt \
              | head -30 \
              | while IFS= read -r line; do
                  safe=$(printf '%s' "$line" | sed 's/%/%25/g' | tr -d '\r')
                  echo "::error title=${{ matrix.os }}::$safe"
                done
          fi
          echo "================ 输出尾部 80 行 ================"
          tail -80 diag-output.txt
          exit "$status"
