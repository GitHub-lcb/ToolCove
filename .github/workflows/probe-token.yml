# 临时探针（用后即删）：用与 Release 流程完全相同的权限声明，试探 GITHUB_TOKEN 是否还能创建 Release。
# 背景：v0.3.0 构建成功创建了草稿 Release，v0.4.0 用逐字节相同的 workflow 却在创建时报
#      「Resource not accessible by integration」——需要确定是仓库设置变了还是别的原因。
name: Probe Token (temp)

on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-token.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: 读取当前仓库的 Actions 权限设置
        run: |
          echo "--- 仓库默认 workflow 权限（需要 admin，可能 403） ---"
          gh api "/repos/$REPO/actions/permissions/workflow" 2>&1 | head -5 || true
          echo "--- 现有 Release 列表（含草稿，能列出说明读权限正常） ---"
          gh release list --repo "$REPO" --limit 10 2>&1 | head -10 || true

      - name: 用同样的 token 试创建探测 Release
        run: |
          echo "--- 尝试创建草稿 Release（探测 tag） ---"
          if gh release create "v0.0.0-token-probe" --repo "$REPO" --draft \
               --title "token probe" --notes "临时探测，立即删除" 2>&1 | tee /tmp/out.txt | head -20; then
            echo "创建成功 → token 有 contents:write"
          else
            echo "创建失败 → 复现了 Release 流程的报错"
            grep -i "resource not accessible\|not accessible by integration\|HTTP 403" /tmp/out.txt || true
          fi
          echo "--- 清理探测 Release 与 tag ---"
          gh release delete "v0.0.0-token-probe" --repo "$REPO" --yes --cleanup-tag 2>&1 | head -5 || true

      - name: 对照：Environment 是否影响
        run: |
          echo "--- 列出仓库 Environments（需要 admin） ---"
          gh api "/repos/$REPO/environments" 2>&1 | head -20 || true
