# iOS 未签名包：GitHub 的 macOS runner 上跨编译，产出 .ipa 挂到 Release。
#
# 为什么是「未签名」：iOS 上没有"装一个没签名的 App"这回事——每个 App 都必须有签名才能运行。
# 免费路线是：这里出未签名包 → 使用者用爱思助手 / Sideloadly 拿自己的免费 Apple ID 重签 → 安装
# （免费 Apple ID 的签名 7 天过期，到期重签一次即可）。要长期免重签只能上 Apple Developer（$99/年）。
#
# 与安卓那条流水线的关系：同一个 package.json 的 mobileVersion 作为版本号，
# 标签形如 ios-v1.3.12（与 apk-v1.3.12 平行，互不影响）。
name: iOS 未签名包

on:
  push:
    tags:
      - "ios-v*"
    # 开发期便利：改到 iOS 壳或前端就顺手编译一次（只是上传 artifact，不碰 Release）。
    # 等壳稳定了可以删掉这三行，只留标签触发。
    branches:
      - main
    paths:
      - "mobile/ios/**"
      - "mobile/app/**"
      - "src/**"
      - ".github/workflows/ios-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS runner 自带 Xcode；arm64 机器直接产出 arm64 包。
    # macos-15 自带 Xcode 16：XcodeGen 2.46 生成的是 objectVersion 77（Xcode 16 格式），
    # 在 macos-14（Xcode 15.4）上会直接报 'future Xcode project file format'。
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 版本号一致性（标签 ↔ package.json 的 mobileVersion）
        if: startsWith(github.ref, 'refs/tags/ios-v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#ios-v}"
          pkg=$(node -p "require('./package.json').mobileVersion")
          echo "标签=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::标签 ios-v$tag 与 package.json 的 mobileVersion $pkg 不一致，请先改版本号再打标签"
            exit 1
          fi

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建网页产物
        run: npm run build:mobile

      - name: 把网页产物装进 iOS 工程
        run: |
          mkdir -p mobile/ios/www
          rm -rf mobile/ios/www/*
          cp -R dist/mobile/app/. mobile/ios/www/
          ls mobile/ios/www | head -20

      - name: 生成工程并编译（不签名）
        working-directory: mobile/ios
        run: |
          chmod +x ci-build.sh verify-ipa.sh
          ./ci-build.sh

      - name: 失败时把构建日志推到 ci/ios-log 分支
        if: failure()
        run: |
          set -e
          mkdir -p ci-log
          cp mobile/ios/build.log ci-log/ios-build.log 2>/dev/null || echo "(没有生成 build.log)" > ci-log/ios-build.log
          git config user.name "toolcove-ci"
          git config user.email "ci@toolcove.local"
          git checkout -B ci/ios-log
          git add -f ci-log/ios-build.log
          git commit -m "ci: iOS 构建日志（${{ github.sha }}）" || true
          git push -f origin ci/ios-log

      - name: 保存产物
        uses: actions/upload-artifact@v4
        with:
          name: toolcove-ios-unsigned
          path: mobile/ios/ToolCove-unsigned.ipa
          if-no-files-found: error

      - name: 生成发布说明
        run: node mobile/ios/release-notes.mjs

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(node -p "require('./package.json').mobileVersion")
          tag="ios-v$version"
          ipa="mobile/ios/ToolCove-unsigned.ipa"
          title="ToolCove iOS $version（未签名）"
          # 已存在就改说明+覆盖资产；否则新建（--latest=false：别抢安卓那边的 latest 指针）
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file release-notes-ios.md
            gh release upload "$tag" "$ipa" --clobber
          else
            gh release create "$tag" --title "$title" --notes-file release-notes-ios.md --latest=false "$ipa"
          fi
