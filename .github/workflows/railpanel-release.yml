# 手机版（铁路大亨悬浮面板）的发版流水线。
#
# 与桌面端的 release.yml 完全分开，理由有三条，都不是洁癖：
#
#  1) **版本号各走各的**。手机版是独立应用（自己的 applicationId、自己的版本号），
#     它的 1.0.0 和桌面端的 0.x 没有对应关系。混在一条线上，以后每次「手机版修个
#     按钮」都会顺带触发一次桌面端发版——构建 + 用签名私钥签名 + 创建草稿 Release。
#     那种连带代价没人愿意付，最后就会变成「手机版改动攒着一起发」。
#
#  2) **必须在 CI 里重新构建 APK，不能上传本地那份**。Actions 跑在云端，看不到开发
#     机上的文件；把 APK 提交进仓库又会让二进制永久留在历史里。所以这里装便携工具链
#     再构建一遍——反正 build-apk.mjs 本来就是脚本化的，托管 runner 上跑得通。
#
#  3) **不需要任何仓库密钥**。APK 用 debug 签名（侧载自用够用），不像桌面端那样
#     依赖 TAURI_SIGNING_PRIVATE_KEY。所以这条流水线可以在没有 secrets 的仓库里跑通。
#
# 用法：把 package.json 里的 mobileVersion 提升，推 main，然后推一个 railpanel-v<版本> 标签：
#     git tag railpanel-v1.0.0 && git push origin railpanel-v1.0.0
# 注意标签前缀是 railpanel-v 而不是 v——后者会触发桌面端发版（见第 1 条）。

name: Rail panel release

on:
  push:
    tags:
      - "railpanel-v*"
  # 手动重跑（构建失败时不用重新打标签）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # 所有第三方 action 都钉在完整 commit SHA 上：浮动标签可以被重新指向恶意代码，
      # 而这个 job 会拿到 contents: write（与 release.yml 同一套理由）。
      # 升级方式：查 `GET /repos/<owner>/<repo>/commits/<tag>` 拿新 SHA，
      # 替换并把注释里的版本号一起改（下面三个 SHA 就是这么查出来的）。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      # 手机版的版本号单一来源是 package.json 的 mobileVersion（不是桌面版的 version，
      # 两者各走各的）。这里先校验 tag 与它一致，避免产出「tag 叫 1.1、包里写着 1.0」
      # 这种事后很难查的发版。桌面端 release.yml 有同款校验，理由一样。
      - name: 校验 tag 与 mobileVersion 一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#railpanel-v}"
          ver=$(node -p "require('./package.json').mobileVersion")
          echo "tag=$tag package.json.mobileVersion=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::标签 railpanel-v$tag 与 package.json 的 mobileVersion $ver 不一致；先改版本号再打标签"
            exit 1
          fi

      # 手机版 HUD 的单测（72 个）。放在构建之前：断言不过就没必要出包。
      - name: 单测（手机版）
        run: |
          npm install --no-audit --no-fund
          npx vitest run mobile/

      # build-apk.mjs 会自己补装 Android SDK 等缺失的组件（runner 上已有 JDK 与 Node）。
      # 它内部优先用 sdkmanager；若 Java 侧 TLS 在该环境不可用，会自动退回
      # 「Node 直接下 Google 组件包」，所以这一步在托管 runner 上不需要额外前置。
      - name: 构建 APK
        shell: pwsh
        run: node mobile/android/build-apk.mjs

      - name: 校验产物
        shell: pwsh
        run: |
          $apk = "mobile/android/out/railpanel-release.apk"
          if (-not (Test-Path $apk)) { throw "没找到 APK：$apk" }
          $size = (Get-Item $apk).Length
          # 体积下限用来挡「构建脚本静默产出了个空包」这类故障
          if ($size -lt 100KB) { throw "APK 只有 $size 字节，明显不对" }
          Write-Host "APK：$apk（$([math]::Round($size/1KB)) KB）"

      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "Rail panel ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: mobile/android/out/railpanel-release.apk
          body: |
            铁路大亨悬浮面板（安卓）${{ github.ref_name }}

            下载下方的 `railpanel-release.apk`，传到手机点开安装（需允许「安装未知来源应用」）。

            装好后：打开应用 → 点「去授权」开启「显示在其他应用上层」→ 点「开启悬浮面板」。

            国内 ROM 需要在系统设置里给本应用开「自启动 / 后台运行」白名单，否则面板会被省电策略清掉
            （各家路径见应用内「省电与后台」那段）。

            本包含 debug 签名，仅用于侧载；进度保存在本机，跨设备用应用内的「导出 / 导入」。
          draft: false
          prerelease: false
          # 安卓版必须 make_latest: false：桌面端更新器读的是 /releases/latest/download/latest.json，
          # 而 GitHub 的 latest = 最新非预发布 Release。不禁止的话，安卓版发版会顶掉桌面端的 latest，
          # 桌面端检查更新就会 404（2026-09-17 railpanel-v1.0.2 顶掉 v0.6.0 的事故）。
          make_latest: "false"
