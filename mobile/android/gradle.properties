# Gradle 守护进程的内存上限：这个工程很小，2g 足够；机器上的默认值有时过大。
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# 增量与缓存：让第二次构建快很多（首次仍然要下载 AGP/KGP）
org.gradle.caching=true
org.gradle.parallel=true

# ── 关于「脚本编译缓存」的一个环境坑 ──────────────────────────────────
# 在本机（Windows 11 + Gradle 8.14.5）上，只要 GRADLE_USER_HOME 落在**本仓库目录内**，
# 构建就稳定失败在 Kotlin/Groovy DSL 脚本缓存上：
#   Could not move temporary workspace (.../caches/<ver>/groovy-dsl/<hash>-<uuid>)
#   to immutable location (.../caches/<ver>/groovy-dsl/<hash>)
# 换了构建脚本语言（Groovy）、清缓存、关 daemon、关 vfs.watch、改成进程内编译都无效；
# 把 GRADLE_USER_HOME 换到仓库外的目录后一次通过。这是 Gradle 侧的问题
# （见 gradle/gradle#31392、#31438），不是本工程配置错误。
#
# 因此 build-apk.mjs **强制**把 GRADLE_USER_HOME 指到仓库外的缓存目录
# （可通过环境变量 RAIL_GRADLE_HOME 覆盖）。这里不设该属性——它由构建脚本传环境变量。

# 不引 androidx，所以不需要 android.useAndroidX=true。
# ⚠️ 一旦引入 androidx 依赖（例如 WebViewAssetLoader），这里必须同步打开，
# 否则 AGP 会以「依赖了 AndroidX 但未启用」直接失败。
android.useAndroidX=false
