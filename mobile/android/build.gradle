// 插件版本在这里集中声明一次，app 模块只引用不带版本。
//
// 这一组版本不是「取最新」，而是照着兼容矩阵配的（详见 README 与 build-apk.mjs 头注）：
//   AGP 8.11.1 → 最低 Gradle 8.13、最低 build-tools 35.0.0、最低 JDK 17
//   Gradle 9.x 官方只测到 AGP 9.x，所以锁在 8.x
//   Kotlin 2.2.21 官方声明支持 Gradle 7.6.3–8.14、AGP 7.3.1–8.11.1
plugins {
    id 'com.android.application' version '8.11.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.21' apply false
}
