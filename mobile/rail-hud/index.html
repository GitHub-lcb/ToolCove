<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：刘海屏/手势条下不让按钮钻到系统条底下（样式里用 safe-area 变量吃掉） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>铁路大亨 · 手机面板</title>
    <!-- STYLES -->
  </head>
  <body>
    <!--
      mode 由原生侧（window.__railBootstrap.mode）或 URL 决定：
        full  = 全屏页（手机浏览器 / Android 全屏 Activity）
        panel = 悬浮窗（约 360×272dp，压在游戏上，绝对不滚动）
        bar   = 悬浮窗收成一条（只剩结论那一行）
      静态文案里写的是中文兜底，页面启动时由 renderStatic() 按当前语言整体覆盖——
      这样「脚本没跑起来」时看到的是中文而不是一排空标签，故障更好认。
    -->
    <div id="root" data-mode="full">
      <header class="topbar">
        <span class="brand">铁路大亨</span>
        <span class="topbar-mode" id="mode-hint"></span>
        <!-- 悬浮窗上把面板收成一条：遮挡面积直接影响游戏能不能点（见 styles.css 的 panel 段） -->
        <button class="collapse" id="btn-collapse" type="button" hidden>收起</button>
      </header>

      <!-- 结论：永远在最上面，不随滚动消失。跑商时唯一必须一眼看清的东西。 -->
      <section class="hero" id="hero" aria-live="polite">
        <!-- 收起成一条之后顶栏整条被藏了，出口改挂在结论卡上：
             收起来仍然要能展开回来，否则用户只能去通知栏关掉面板再重开。 -->
        <button class="expand" id="btn-expand" type="button" hidden>展开面板</button>
      </section>

      <!-- 16 格记录进度：一格一站，回答「我记到哪了、哪站还欠一半」 -->
      <div class="strip-wrap">
        <div class="strip" id="strip" role="group"></div>
        <span class="strip-note" id="strip-note"></span>
      </div>

      <!-- 建议：只留决定性条目，通用节奏建议折叠起来 -->
      <section class="advice-block">
        <button class="advice-toggle" id="advice-toggle" type="button"></button>
        <div class="advice" id="advice"></div>
        <div class="advice" id="advice-more" hidden></div>
      </section>

      <!-- 录入：钉在底部拇指区，滚动中间那段不会把它顶走 -->
      <section class="setup" id="setup"></section>

      <nav class="actionbar">
        <button class="act" id="btn-all" type="button">全部记录</button>
        <button class="act" id="btn-copy" type="button">复制结论</button>
        <button class="act" id="btn-export" type="button">导出</button>
        <button class="act" id="btn-import" type="button">导入</button>
        <button class="act danger" id="btn-reset" type="button">清空</button>
      </nav>
    </div>

    <!-- ── 全部记录 ─────────────────────────────────────────────────── -->
    <div class="dialog" id="records" hidden>
      <div class="sheet" role="dialog" aria-modal="true">
        <header class="sheet-head">
          <b id="records-title">全部记录</b>
          <span class="sheet-sub" id="records-sub">改完立即重算</span>
          <button class="act" id="records-close" type="button" data-close>关闭</button>
        </header>
        <div class="rec-cols" aria-hidden="true"><span>站</span><span>类型</span><span>提示</span><span>推断</span></div>
        <div class="rec-list" id="records-list"></div>
      </div>
    </div>

    <!-- ── 导出 ─────────────────────────────────────────────────────── -->
    <div class="dialog" id="export" hidden>
      <div class="sheet narrow" role="dialog" aria-modal="true">
        <header class="sheet-head">
          <b id="export-title">导出进度</b>
          <button class="act" id="export-close" type="button" data-close>关闭</button>
        </header>
        <p class="sheet-body" id="export-desc"></p>
        <p class="file-name" id="export-name"></p>
        <textarea class="io-text" id="export-text" readonly rows="6"></textarea>
        <div class="sheet-btns">
          <button class="act primary" id="export-copy" type="button">复制 JSON</button>
        </div>
      </div>
    </div>

    <!-- ── 导入 ─────────────────────────────────────────────────────── -->
    <div class="dialog" id="import" hidden>
      <div class="sheet narrow" role="dialog" aria-modal="true">
        <header class="sheet-head">
          <b id="import-title">导入进度</b>
          <button class="act" id="import-close" type="button" data-close>关闭</button>
        </header>
        <p class="sheet-body" id="import-desc"></p>
        <textarea class="io-text" id="import-text" rows="6"></textarea>
        <input type="file" id="file-input" accept="application/json,.json" hidden />
        <div class="sheet-btns">
          <button class="act" type="button" data-import-pick>选择文件…</button>
          <button class="act primary" id="import-apply" type="button">导入并覆盖</button>
        </div>
      </div>
    </div>

    <!-- ── 清空确认 ─────────────────────────────────────────────────── -->
    <div class="dialog" id="reset" hidden>
      <div class="sheet narrow" role="dialog" aria-modal="true">
        <header class="sheet-head"><b id="reset-title">清空全部 16 站记录？</b></header>
        <p class="sheet-body" id="reset-desc"></p>
        <div class="sheet-btns">
          <button class="act" id="reset-cancel" type="button" data-close>取消</button>
          <button class="act danger" id="reset-ok" type="button">清空并回始发站</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <!-- SCRIPT -->
  </body>
</html>
